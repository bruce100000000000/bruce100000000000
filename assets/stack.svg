<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230"><style>text{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif}
.b{animation:drift 18s ease-in-out infinite alternate}
.b2{animation-duration:23s;animation-delay:-6s}
.b3{animation-duration:27s;animation-delay:-12s}
@keyframes drift{0%{transform:translate(0,0)}33%{transform:translate(90px,-40px)}66%{transform:translate(-70px,50px)}100%{transform:translate(40px,20px)}}
.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.fade{animation:fade 1.2s ease-out both}@keyframes fade{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
